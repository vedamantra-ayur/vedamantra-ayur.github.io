<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vedamantra — Ayurvedic Wellness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F8F2DE;
    --bg-deep: #EFE3BE;
    --forest: #123527;
    --forest-2: #1B6B45;
    --forest-3: #2E8F5C;
    --sage: #5D9468;
    --sage-soft: #D8ECD3;
    --turmeric: #E39A2B;
    --turmeric-deep: #B5701A;
    --clay: #C1602E;
    --ink: #17241A;
    --card: #FFFEFB;
    --card-line: #E3D7AC;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12201A;
      --bg-deep: #0C1712;
      --forest: #E7F0E6;
      --forest-2: #7FD1A0;
      --forest-3: #57B37E;
      --sage: #6FAE7C;
      --sage-soft: #1E3A28;
      --turmeric: #F2B85A;
      --turmeric-deep: #F7CD84;
      --clay: #E08657;
      --ink: #EAF0E6;
      --card: #17281F;
      --card-line: #2C4433;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12201A; --bg-deep: #0C1712; --forest: #E7F0E6; --forest-2: #7FD1A0; --forest-3: #57B37E;
    --sage: #6FAE7C; --sage-soft: #1E3A28; --turmeric: #F2B85A; --turmeric-deep: #F7CD84;
    --clay: #E08657; --ink: #EAF0E6; --card: #17281F; --card-line: #2C4433;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
    color: var(--ink);
    font-family: 'Karla', sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .display { font-family: 'Fraunces', serif; }

  #leafLayer { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  #leafLayer svg { position: absolute; opacity: 0.14; }

  .wrap { position: relative; z-index: 1; max-width: 1020px; margin: 0 auto; padding: 0 20px 120px; }

  header.hero {
    position: relative;
    padding: 44px 20px 0;
    text-align: center;
    color: #F7F2DE;
    background: radial-gradient(130% 170% at 50% -20%, var(--forest-3) 0%, var(--forest-2) 45%, var(--forest) 100%);
    overflow: hidden;
  }
  header.hero .inner { position: relative; z-index: 2; max-width: 640px; margin: 0 auto; padding-bottom: 40px; }
  .brand-logo { width: 128px; margin: 0 auto 6px; display: block; filter: drop-shadow(0 2px 10px rgba(0,0,0,0.25)); }
  .brand-eyebrow {
    display: inline-block;
    font-family: 'Karla', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--turmeric);
    font-weight: 700;
    margin-bottom: 10px;
  }
  header.hero h1 {
    font-size: clamp(2.1rem, 5.6vw, 2.9rem);
    font-weight: 600;
    letter-spacing: 0.01em;
    margin: 0 0 10px;
    color: #FBF6E4;
  }
  header.hero p.tag {
    font-size: 1.05rem;
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-style: italic;
    color: #F0E4BF;
    margin: 0 0 20px;
    max-width: 46ch;
    margin-inline: auto;
  }
  .hero-note {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 0.86rem;
    color: rgba(247,242,222,0.82);
    border-top: 1px solid rgba(247,242,222,0.25);
    padding-top: 16px;
    margin-top: 4px;
  }
  .hero-strip {
    height: 6px;
    background: linear-gradient(90deg, var(--turmeric) 0%, var(--clay) 50%, var(--turmeric) 100%);
  }

  .category { margin-top: 52px; }
  .category h2 {
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--forest-2);
    margin: 0 0 4px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  :root[data-theme="dark"] .category h2, body { }
  .category h2 { color: var(--forest-2); }
  .category .cat-count { font-family: 'Karla',sans-serif; font-size: 0.78rem; color: var(--turmeric-deep); font-weight: 700; background: var(--sage-soft); padding: 3px 9px; border-radius: 999px; }
  .category .cat-desc { margin: 0 0 20px; color: var(--ink); opacity: 0.65; font-size: 0.92rem; max-width: 60ch; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }

  .card {
    background: var(--card);
    border: 1px solid var(--card-line);
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 2px 10px rgba(18,53,39,0.06);
  }
  .card .photo {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--sage-soft);
    object-fit: cover;
    display: block;
  }
  .card .photo-fallback {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--sage-soft);
    display: flex; align-items: center; justify-content: center;
  }
  .card .body { padding: 14px 14px 14px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .card h3 { font-size: 0.98rem; font-weight: 500; margin: 0; line-height: 1.3; color: var(--ink); min-height: 2.5em; }
  .card .price { font-family: 'Karla', sans-serif; font-weight: 700; color: var(--turmeric-deep); font-size: 1rem; }
  .card .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; }
  .stepper { display: flex; align-items: center; border: 1px solid var(--card-line); border-radius: 10px; overflow: hidden; }
  .stepper button { width: 30px; height: 30px; border: none; background: transparent; color: var(--forest-2); font-size: 1.05rem; cursor: pointer; }
  .stepper span { min-width: 24px; text-align: center; font-weight: 600; font-size: 0.9rem; }
  .add-btn {
    border: none; background: var(--forest-2); color: #FBF6E4; padding: 9px 15px; border-radius: 10px;
    font-family: 'Karla', sans-serif; font-weight: 700; font-size: 0.84rem; cursor: pointer; transition: transform 0.12s ease;
  }
  .add-btn:active { transform: scale(0.96); }
  .add-btn.added { background: var(--turmeric-deep); }

  #cartFab {
    position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 40;
    background: var(--forest-2); color: #FBF6E4; border: none; border-radius: 999px; padding: 14px 20px;
    display: flex; align-items: center; gap: 10px; font-family: 'Karla', sans-serif; font-weight: 700; font-size: 0.95rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.28); cursor: pointer;
  }
  #cartFab .badge { background: var(--turmeric); color: #241804; border-radius: 999px; min-width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 0.78rem; padding: 0 6px; }

  #overlay { position: fixed; inset: 0; background: rgba(11,20,15,0.5); z-index: 49; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
  #overlay.open { opacity: 1; pointer-events: auto; }

  #drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100vw); background: var(--bg); z-index: 50;
    transform: translateX(100%); transition: transform 0.28s cubic-bezier(.4,0,.2,1);
    display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    border-left: 1px solid var(--card-line);
  }
  #drawer.open { transform: translateX(0); }
  .drawer-head { padding: 20px 20px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--card-line); }
  .drawer-head h2 { margin: 0; font-size: 1.3rem; color: var(--forest-2); }
  .drawer-head button.close { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--ink); line-height: 1; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 8px 20px; }
  .cart-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--card-line); }
  .cart-item img { width: 46px; height: 46px; border-radius: 10px; object-fit: cover; flex-shrink: 0; background: var(--sage-soft); }
  .cart-item .ci-name { flex: 1; font-size: 0.9rem; }
  .cart-item .ci-name .sub { display: block; color: var(--turmeric-deep); font-weight: 700; font-size: 0.82rem; margin-top: 2px; }
  .cart-item .remove { background: none; border: none; color: var(--ink); opacity: 0.5; font-size: 1.1rem; cursor: pointer; padding: 4px; }
  .empty-cart { text-align: center; padding: 60px 10px; color: var(--ink); opacity: 0.6; font-size: 0.95rem; }

  .drawer-foot { border-top: 1px solid var(--card-line); padding: 16px 20px 20px; }
  .subtotal-row { display: flex; justify-content: space-between; font-weight: 700; font-size: 1.05rem; margin-bottom: 14px; color: var(--forest-2); }
  .primary-btn { width: 100%; background: var(--forest-2); color: #FBF6E4; border: none; border-radius: 12px; padding: 14px; font-family: 'Karla', sans-serif; font-weight: 700; font-size: 0.98rem; cursor: pointer; }
  .primary-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .ghost-btn { width: 100%; background: transparent; border: 1px solid var(--card-line); color: var(--ink); border-radius: 12px; padding: 12px; font-family: 'Karla', sans-serif; font-weight: 600; font-size: 0.9rem; cursor: pointer; margin-top: 8px; }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--forest-2); margin-bottom: 5px; }
  .field input, .field textarea { width: 100%; border: 1px solid var(--card-line); border-radius: 10px; padding: 10px 12px; font-family: 'Karla', sans-serif; font-size: 0.92rem; background: var(--card); color: var(--ink); }
  .field textarea { resize: vertical; min-height: 64px; }
  .back-link { background: none; border: none; color: var(--sage); font-family: 'Karla',sans-serif; font-size: 0.85rem; cursor: pointer; padding: 0 0 10px; }

  .success-note { text-align: center; padding: 50px 10px; }
  .success-note .glyph { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 50%; background: var(--sage-soft); display: flex; align-items: center; justify-content: center; }
  .success-note h3 { margin: 0 0 8px; color: var(--forest-2); }
  .success-note p { color: var(--ink); opacity: 0.7; font-size: 0.9rem; }

  footer.site-foot { text-align: center; padding: 36px 20px 10px; color: var(--ink); opacity: 0.55; font-size: 0.82rem; }
</style>
</head>
<body>

<div id="leafLayer"></div>

<header class="hero">
  <div class="inner">
    <img class="brand-logo" id="brandLogo" alt="Vedamantra logo" />
    <div class="brand-eyebrow">Ayurvedic Wellness</div>
    <h1>Vedamantra</h1>
    <p class="tag">Rooted in tradition, crafted with care.</p>
    <p class="hero-note">Add products to your cart → share your delivery details → confirm with us on WhatsApp</p>
  </div>
</header>
<div class="hero-strip"></div>

<div class="wrap">
  <div id="catalog"></div>
</div>

<footer class="site-foot">Vedamantra · Orders are confirmed and paid for directly over WhatsApp</footer>

<button id="cartFab" aria-label="Open cart">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 4h2l2.4 12.4a2 2 0 0 0 2 1.6h7.2a2 2 0 0 0 2-1.6L21 8H6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="21" r="1.4" fill="currentColor"/><circle cx="18" cy="21" r="1.4" fill="currentColor"/></svg>
  <span>Cart</span>
  <span class="badge" id="cartBadge">0</span>
</button>

<div id="overlay"></div>
<div id="drawer">
  <div class="drawer-head">
    <h2 id="drawerTitle">Your cart</h2>
    <button class="close" id="closeDrawer" aria-label="Close">&times;</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot" id="drawerFoot"></div>
</div>

      {id:"p26", name:"Swasthya (250gms)", price:1000}
    ]},
    {cat:"Pain Relief", desc:"Oils and balms for quick relief.", items:[
      {id:"p28", name:"Insta Pain Off Oil (200ml)", price:595},
      {id:"p29", name:"Insta Pain Off Balm (10gms)", price:70},
      {id:"p30", name:"Insta Pain Off Balm (50gms)", price:315}
    ]}
  ];

  var WHATSAPP_NUMBER = "919849953533";

  var cart = {};
  var pendingQty = {};

  var catalogEl = document.getElementById('catalog');
  var cartFab = document.getElementById('cartFab');
  var cartBadge = document.getElementById('cartBadge');
  var overlay = document.getElementById('overlay');
  var drawer = document.getElementById('drawer');
  var closeDrawer = document.getElementById('closeDrawer');
  var drawerBody = document.getElementById('drawerBody');
  var drawerFoot = document.getElementById('drawerFoot');
  var drawerTitle = document.getElementById('drawerTitle');
  var view = 'cart';

  var brandLogo = document.getElementById('brandLogo');
  if (IMG.logo) brandLogo.src = IMG.logo;

  function allProducts(){
    var out = [];
    PRODUCTS.forEach(function(c){ c.items.forEach(function(p){ out.push(p); }); });
    return out;
  }
  var PRODUCT_MAP = {};
  allProducts().forEach(function(p){ PRODUCT_MAP[p.id] = p; });

  function money(n){ return "₹" + n.toLocaleString('en-IN'); }

  function leafSvg(){
    return '<svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 21c-4-2-7-6-7-11 5 0 9 3 11 7 2-4 6-7 11-7 0 5-3 9-7 11-2-1-4-1-8 0z" stroke="var(--forest-2)" stroke-width="1.3"/></svg>';
  }

  function renderCatalog(){
    var html = '';
    PRODUCTS.forEach(function(cat){
      html += '<section class="category">';
      html += '<h2>' + cat.cat + ' <span class="cat-count">' + cat.items.length + ' items</span></h2>';
      html += '<p class="cat-desc">' + cat.desc + '</p>';
      html += '<div class="grid">';
      cat.items.forEach(function(p){
        pendingQty[p.id] = pendingQty[p.id] || 1;
        var photoHtml = IMG[p.id]
          ? '<img class="photo" src="' + IMG[p.id] + '" alt="' + p.name + '" loading="lazy">'
          : '<div class="photo-fallback">' + leafSvg() + '</div>';
        html += '' +
          '<div class="card" data-id="' + p.id + '">' +
            photoHtml +
            '<div class="body">' +
              '<h3>' + p.name + '</h3>' +
              '<div class="price">' + money(p.price) + '</div>' +
              '<div class="row">' +
                '<div class="stepper">' +
                  '<button class="dec" aria-label="Decrease">−</button>' +
                  '<span class="qty">' + pendingQty[p.id] + '</span>' +
                  '<button class="inc" aria-label="Increase">+</button>' +
                '</div>' +
                '<button class="add-btn">Add</button>' +
              '</div>' +
            '</div>' +
          '</div>';
      });
      html += '</div></section>';
    });
    catalogEl.innerHTML = html;
  }

  catalogEl.addEventListener('click', function(e){
    var card = e.target.closest('.card');
    if(!card) return;
    var id = card.getAttribute('data-id');
    if(e.target.classList.contains('inc')){
      pendingQty[id]++;
      card.querySelector('.qty').textContent = pendingQty[id];
    } else if(e.target.classList.contains('dec')){
      pendingQty[id] = Math.max(1, pendingQty[id]-1);
      card.querySelector('.qty').textContent = pendingQty[id];
    } else if(e.target.classList.contains('add-btn')){
      cart[id] = (cart[id] || 0) + pendingQty[id];
      pendingQty[id] = 1;
      card.querySelector('.qty').textContent = 1;
      var btn = e.target;
      btn.textContent = 'Added ✓';
      btn.classList.add('added');
      setTimeout(function(){ btn.textContent = 'Add'; btn.classList.remove('added'); }, 900);
      updateBadge();
    }
  });

  function cartCount(){ return Object.keys(cart).reduce(function(sum,id){ return sum + cart[id]; }, 0); }
  function cartSubtotal(){ return Object.keys(cart).reduce(function(sum,id){ return sum + cart[id] * PRODUCT_MAP[id].price; }, 0); }
  function updateBadge(){ cartBadge.textContent = cartCount(); }

  function openDrawer(v){ view = v || 'cart'; renderDrawer(); overlay.classList.add('open'); drawer.classList.add('open'); }
  function closeAll(){ overlay.classList.remove('open'); drawer.classList.remove('open'); }
  cartFab.addEventListener('click', function(){ openDrawer('cart'); });
  closeDrawer.addEventListener('click', closeAll);
  overlay.addEventListener('click', closeAll);

  function renderDrawer(){
    if(view === 'cart') renderCartView();
    else if(view === 'checkout') renderCheckoutView();
    else if(view === 'success') renderSuccessView();
  }

  function renderCartView(){
    drawerTitle.textContent = 'Your cart';
    var ids = Object.keys(cart);
    if(ids.length === 0){
      drawerBody.innerHTML = '<div class="empty-cart">Your cart is empty.<br>Add a few products to get started.</div>';
      drawerFoot.innerHTML = '';
      return;
    }
    var html = '';
    ids.forEach(function(id){
      var p = PRODUCT_MAP[id];
      var thumb = IMG[id] ? '<img src="' + IMG[id] + '" alt="">' : '';
      html += '' +
        '<div class="cart-item" data-id="' + id + '">' +
          thumb +
          '<div class="ci-name">' + p.name + '<span class="sub">' + cart[id] + ' × ' + money(p.price) + ' = ' + money(cart[id]*p.price) + '</span></div>' +
          '<div class="stepper">' +
            '<button class="c-dec" aria-label="Decrease">−</button>' +
            '<span>' + cart[id] + '</span>' +
            '<button class="c-inc" aria-label="Increase">+</button>' +
          '</div>' +
          '<button class="remove" aria-label="Remove">&times;</button>' +
        '</div>';
    });
    drawerBody.innerHTML = html;
    drawerFoot.innerHTML = '' +
      '<div class="subtotal-row"><span>Subtotal</span><span>' + money(cartSubtotal()) + '</span></div>' +
      '<button class="primary-btn" id="toCheckout">Checkout</button>';
    document.getElementById('toCheckout').addEventListener('click', function(){ openDrawer('checkout'); });

    drawerBody.querySelectorAll('.c-inc').forEach(function(b){
      b.addEventListener('click', function(){ var id=b.closest('.cart-item').dataset.id; cart[id]++; renderCartView(); updateBadge(); });
    });
    drawerBody.querySelectorAll('.c-dec').forEach(function(b){
      b.addEventListener('click', function(){ var id=b.closest('.cart-item').dataset.id; cart[id]--; if(cart[id]<=0) delete cart[id]; renderCartView(); updateBadge(); });
    });
    drawerBody.querySelectorAll('.remove').forEach(function(b){
      b.addEventListener('click', function(){ var id=b.closest('.cart-item').dataset.id; delete cart[id]; renderCartView(); updateBadge(); });
    });
  }

  function renderCheckoutView(){
    drawerTitle.textContent = 'Delivery details';
    drawerBody.innerHTML = '' +
      '<button class="back-link" id="backToCart">&larr; Back to cart</button>' +
      '<div class="field"><label for="fName">Full name</label><input id="fName" type="text" placeholder="Your name" autocomplete="name"></div>' +
      '<div class="field"><label for="fPhone">Phone number</label><input id="fPhone" type="tel" placeholder="10-digit mobile number" autocomplete="tel"></div>' +
      '<div class="field"><label for="fAddr">Delivery address</label><textarea id="fAddr" placeholder="House/flat, street, area, city, pincode"></textarea></div>';
    document.getElementById('backToCart').addEventListener('click', function(){ openDrawer('cart'); });

    drawerFoot.innerHTML = '' +
      '<div class="subtotal-row"><span>Subtotal</span><span>' + money(cartSubtotal()) + '</span></div>' +
      '<button class="primary-btn" id="sendWa">Send order on WhatsApp</button>';
    document.getElementById('sendWa').addEventListener('click', sendOrder);
  }

  function sendOrder(){
    var name = document.getElementById('fName').value.trim();
    var phone = document.getElementById('fPhone').value.trim();
    var addr = document.getElementById('fAddr').value.trim();
    if(!name || !phone || !addr){
      alert('Please fill in your name, phone number, and delivery address.');
      return;
    }
    var lines = ['Hello Vedamantra! I would like to place an order:', ''];
    var i = 1;
    Object.keys(cart).forEach(function(id){
      var p = PRODUCT_MAP[id];
      lines.push(i + '. ' + p.name + ' × ' + cart[id] + ' — ' + money(p.price*cart[id]));
      i++;
    });
    lines.push('');
    lines.push('Subtotal: ' + money(cartSubtotal()));
    lines.push('');
    lines.push('Name: ' + name);
    lines.push('Phone: ' + phone);
    lines.push('Delivery Address: ' + addr);
    var text = encodeURIComponent(lines.join('\n'));
    var url = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + text;
    window.open(url, '_blank');
    openDrawer('success');
    cart = {};
    updateBadge();
  }

  function renderSuccessView(){
    drawerTitle.textContent = 'Order sent';
    drawerBody.innerHTML = '' +
      '<div class="success-note">' +
        '<div class="glyph"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="var(--forest-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>' +
        '<h3>Sent to WhatsApp</h3>' +
        '<p>We opened WhatsApp with your order details. Send the message to confirm — we\'ll get back to you about payment and delivery.</p>' +
      '</div>';
    drawerFoot.innerHTML = '<button class="ghost-btn" id="doneBtn">Continue shopping</button>';
    document.getElementById('doneBtn').addEventListener('click', closeAll);
  }

  function buildLeafBackground(){
    var layer = document.getElementById('leafLayer');
    var leafPath = 'M12 21c-4-2-7-6-7-11 5 0 9 3 11 7 2-4 6-7 11-7 0 5-3 9-7 11-2-1-4-1-8 0z';
    var count = window.innerWidth < 640 ? 10 : 18;
    var html = '';
    for(var k=0;k<count;k++){
      var x = Math.random()*100;
      var y = Math.random()*100;
      var rot = Math.random()*360;
      var scale = 0.6 + Math.random()*1.6;
      html += '<svg style="left:' + x + '%; top:' + y + '%; width:48px; height:48px; transform: translate(-50%,-50%) rotate(' + rot + 'deg) scale(' + scale.toFixed(2) + ');" viewBox="0 0 24 24"><path d="' + leafPath + '" fill="none" stroke="#3F7A55" stroke-width="1"/></svg>';
    }
    layer.innerHTML = html;
  }

  renderCatalog();
  buildLeafBackground();
  updateBadge();
})();
</script>
</body>
</html>
